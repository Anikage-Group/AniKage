<!doctype html>
<html lang="en" data-theme="lantern">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="Anikage — cinematic anime streaming." />

		<!-- Open Graph / Twitter card. Pages override these at runtime
		     (see src/lib/utils/og.ts); this is the site-wide fallback. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Anikage" />
		<meta property="og:title" content="Anikage — Cinematic Anime Streaming" />
		<meta property="og:description" content="Stream anime with a fast, distraction-free player." />
		<meta property="og:image" content="/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Anikage — cinematic anime streaming" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Anikage — Cinematic Anime Streaming" />
		<meta name="twitter:description" content="Stream anime with a fast, distraction-free player." />
		<meta name="twitter:image" content="/og.png" />

		<link rel="icon" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Prevent theme flash: apply persisted theme before first paint.
			(function () {
				try {
					var raw = localStorage.getItem('anikage:theme');
					var id = raw ? JSON.parse(raw) : 'lantern';
					document.documentElement.setAttribute('data-theme', id || 'lantern');
					var light = ['sakura', 'nordic', 'matcha', 'solaris', 'lavender', 'coffee', 'rose', 'mint', 'peach', 'sky'].indexOf(id) > -1;
					document.documentElement.classList.toggle('light', light);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
